[project]
name = "mcp-file-organizer"
version = "0.1.0"
description = "A local MCP server for organizing files using Claude"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "send2trash",
]

[project.scripts]
mcp-file-organizer = "mcp_file_organizer.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
